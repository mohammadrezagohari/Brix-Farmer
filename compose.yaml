services:
  api:
    build: {context: ., dockerfile: infra/api.Dockerfile}
    env_file: apps/api/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agritrade
      DB_USERNAME: agritrade
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(file_get_contents('http://localhost:8000/api/v1/health') ? 0 : 1);"]
      interval: 15s
  web:
    build: {context: ., dockerfile: infra/web.Dockerfile}
    environment:
      API_ORIGIN: 'http://api:8000'
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
  proxy:
    image: nginx:alpine
    ports: ['8080:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [api, web]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agritrade
      POSTGRES_USER: agritrade
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agritrade']
      interval: 5s
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ['9001:9001']
  mailpit:
    image: axllent/mailpit
    ports: ['8025:8025']
volumes:
  postgres-data:
  minio-data:
